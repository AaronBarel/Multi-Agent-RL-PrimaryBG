[project]
name = "primary-marl"
version = "0.1.0"
description = "Multi-agent reinforcement learning for The Primary board game"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "gymnasium>=0.29",
    "pettingzoo>=1.24.3",
    "pyarrow>=15",
    "pyyaml>=6.0",
]

[project.scripts]
primary = "primary.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]  # design docs keep their code blocks exactly as written

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is enforced by `ruff format`; long rule-text strings are fine

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/primary/data", "src/primary/engine", "src/primary/env"]

[[tool.mypy.overrides]]
module = ["pettingzoo.*", "gymnasium.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["primary.env.*"]
disallow_subclassing_any = false
